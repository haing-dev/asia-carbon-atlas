# Coverage % (bar above each region's map) = credits issued in the registries the atlas covers
#   ÷ (that + credits issued in the region's credit-issuing programmes it does not cover).
# Uncovered programmes are listed here with their latest published cumulative issuance (issued, as_of, url).
# Cercarbono is computed automatically from CarbonPlan OffsetsDB (data/lookups/retirements.jsonl, COV: rows).
# The % is shown only once every programme marked `major: true` in that region has a published figure; until then
# the bar says which programmes are still being measured. Programmes that only re-label credits of covered registries
# (e.g. ARB / Washington compliance offsets on CAR/ACR/Verra projects, Social Carbon on Verra) are not listed, so
# nothing is counted twice. Forecast or ex-ante units (UK PIUs, Climate Forward FMUs) are not counted.
# issued: one number for the whole programme in that region, or {ISO3: number}.
