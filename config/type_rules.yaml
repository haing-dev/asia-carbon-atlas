# Credit-type classification rules (docs/SPEC.md §6). First match wins.
# Each rule's regex is tested (case-insensitive) against "<registry type> | <methodology> | <project name>".
# Registry types: Berkeley VROD "Scope / Type", UNEP-CCC "Type / Sub-type", Puro methodology names.
rules:
  # 1) Name/keyword signals that override the registry's broad type
  - {re: 'mangrove|seagrass|blue carbon|tidal wetland|VM0033', l2: blue_carbon}
  - {re: 'agro-?forestry', l2: agroforestry}
  # 2) Exact registry types (Berkeley VROD "Scope / Type")
  - {re: '^Household & Community / Biodigesters', l2: household_biogas}
  - {re: '^Household & Community / (Clean Water|Community Boreholes)', l2: water}
  - {re: 'Mine Methane Capture|Coal Mine Methane', l2: coal_mine_methane}
  - {re: 'Avoided Grassland Conversion', l2: other_land}
  - {re: 'Avoided Forest Conversion', l2: redd}
  - {re: 'Plugging Oil & Gas Wells|Orphan(ed)? (oil|well)', l2: oil_gas_methane}
  - {re: 'Refrigerant Leak|Refrigerant', l2: industrial_gases}
  - {re: '^Household & Community / Cookstoves', l2: cookstoves}
  - {re: '^Household & Community / (Lighting|Bundled Energy Efficiency)', l2: buildings}
  - {re: '^Waste Management / Composting', l2: composting}
  - {re: '^Agriculture / Rice Emission Reductions', l2: rice_methane}
  - {re: '^Agriculture / Improved Irrigation Management(?=.*(rice|paddy))', l2: rice_methane}  # irrigation alone is not rice (e.g. solar pumps for salt farmers)
  - {re: '^Agriculture / Sustainable Agriculture', l2: soil_carbon}
  - {re: '^Agriculture / (Manure Methane Digester|Feed Additives)', l2: livestock}
  - {re: '^Forestry & Land Use / Wetland Restoration', l2: peat_wetland}
  - {re: '^Forestry & Land Use / REDD', l2: redd}
  - {re: '^Forestry & Land Use / Afforestation', l2: arr}
  - {re: '^Forestry & Land Use / Sustainable Grassland', l2: soil_carbon}
  - {re: '^Carbon Capture & Storage / Carbon Capture in Concrete', l2: mineralization}
  - {re: '^Transportation / Electric Vehicles', l2: e_mobility}
  - {re: '^Renewable Energy / Biomass', l2: biomass_power}
  # 3) Keyword rules (CDM/UNEP types, methodologies, names)
  # Forestry & land use
  - {re: '\bREDD\b|avoided (planned |unplanned )?deforestation|avoided conversion|VM0007|VM0009|VM0015|VM0048', l2: redd}
  - {re: 'mangrove|seagrass|blue carbon|tidal wetland|VM0033', l2: blue_carbon}
  - {re: '\bpeat|pocosin|wetland restoration|VM0036', l2: peat_wetland}
  - {re: 'improved forest management|\bIFM\b|VM0010|VM0012|forest management', l2: ifm}
  - {re: 'agroforestry', l2: agroforestry}
  - {re: 'afforestation|reforestation|revegetation|\bARR\b|AR-A[CM]|AR-AMS|tree planting|Forestry & Land Use / (A/R|ARR)', l2: arr}
  # Industrial gases (before agriculture so 'N2O at fertilizer plant' stays industrial)
  - {re: '\bHFCs?\b|\bHFC-|\bPFCs?\b|\bSF6\b|nitric acid|adipic acid|caprolactam|industrial gas|ozone depleting|N2O / ', l2: industrial_gases}
  # Agriculture
  - {re: 'rice (cultivation|paddy|field|farm|methane|water)|paddy|alternate wetting|\bAWD\b|direct seeded rice|AMS-III\.AU', l2: rice_methane}
  - {re: 'soil carbon|sustainable agricultural land|regenerative (agri|farm|grazing)|grassland|grazing|VM0017|VM0021|VM0042|sustainable land management', l2: soil_carbon}
  - {re: 'manure|livestock|enteric|feed additive|animal waste|poultry litter|swine|piggery|dairy farm|hog farm', l2: livestock}
  - {re: 'fertili[sz]er (management|use|application)|nitrogen management|nitrogen use efficiency|N2O.*(agri|soil)', l2: fertilizer}
  # Engineered & hybrid removal
  - {re: 'biochar|bio-char', l2: biochar}
  - {re: 'rock weathering|\bERW\b|enhanced weathering', l2: erw}
  - {re: 'direct air capture|\bDAC(CS)?\b', l2: dac}
  - {re: 'BECCS|bioenergy with carbon capture|geologically stored carbon', l2: beccs}
  - {re: 'carbonated materials|mineraliz|mineralis|concrete curing', l2: mineralization}
  - {re: 'wooden building|terrestrial storage of biomass|biomass storage|wood products', l2: biomass_storage}
  # Household & community
  - {re: 'cook ?stove|stoves|clean cooking|TPDDTEC|AMS-II\.G|improved cooking|solar cooking', l2: cookstoves}
  - {re: 'water purification|water filter|safe water|borehole|AMS-III\.AV', l2: water}
  - {re: 'household biogas|domestic biogas|domestic manure|biogas digesters? for households', l2: household_biogas}
  - {re: 'solar (home|lantern|lamp)|off-grid lighting|EE households / Lighting|lighting in households|AMS-III\.AR', l2: offgrid_solar}
  # Waste & methane
  - {re: 'landfill', l2: landfill}
  - {re: 'waste ?water|POME|palm oil (mill )?effluent|Methane avoidance / Palm oil waste', l2: wastewater}
  - {re: 'compost', l2: composting}
  - {re: 'coal ?mine methane|coal bed|\bCMM\b|\bVAM\b|mine methane', l2: coal_mine_methane}
  - {re: 'flaring|fugitive|gas leak|pipeline leak|oil field|natural gas pipelines|oil and gas', l2: oil_gas_methane}
  - {re: 'biogas|anaerobic digest|methane avoidance|methane recovery|Waste Management|combustion of MSW|solid waste|waste to energy project|\bRDF\b|refuse.derived|CBG project|animal dung|dung2power', l2: biogas_ad}
  # Industrial
  - {re: 'cement|clinker|blended cement', l2: cement}
  - {re: 'fuel switch|coal to (natural )?gas|oil to (natural )?gas|natural gas plant', l2: fuel_switch}
  # Transport
  - {re: 'electric vehicle|e-mobility|motorbike|EV charging|electric (bus|two|three)', l2: e_mobility}
  - {re: 'mass transit|\bmetro\b|\bBRT\b|\brail(way)?s?\b|bus rapid|mode shift|cable car', l2: mass_transit}
  - {re: 'eco-?driving|tachograph|\bbus(es)?\b|\bCNG\b', l2: fleet}
  - {re: '\btransport|\bfleet|\bvehicles?\b|fuel efficiency', l2: fleet}
  # Renewable energy
  - {re: '\bwind', l2: wind}
  - {re: '\bsolar|photovoltaic|\bPV\b', l2: solar}
  - {re: '\bhydro(?!gen)|hydel|run of river|run-of-river|\bdam\b', l2: hydro}
  - {re: 'geothermal', l2: geothermal}
  - {re: 'biomass|bagasse|sugars? (ltd|mill|factory)|rice husk|agricultural residue|forest residue|black liquor|briquette|gasification', l2: biomass_power}
  - {re: '\btidal|wave energy|mixed renewables|tribrid|hybrid (power )?project|renewable energy|ACM0002|AMS-I\.D|AMS-I\.F', l2: other_re}
  # Energy efficiency
  - {re: 'waste heat|heat recovery|own generation|\bWHR\b|coke oven gas|co-?generation', l2: waste_heat}
  - {re: '\bbuildings?\b|lighting|\bHVAC\b|air.condition|hospital|\bhotel|street ?light|appliance|EE service|EE households|chiller|\bLED\b|\bCFL\b', l2: buildings}
  - {re: 'distribution|transmission|\bgrids?\b|\bT&D\b|energy distribution', l2: grid}
  - {re: 'energy efficiency|EE Industry|EE supply side|EE industry|efficient|high.efficiency|energy saving|boiler|industrial|\bloom|refrigerat|heat pump|burner|refiner(y|ies)|autoclave|furnace|pump|recycling|optimi[sz]', l2: industrial_ee}
