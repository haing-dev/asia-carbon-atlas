# Searchable project tags (shown in the "Tag" column). A project can carry several tags.
# Evidence comes only from the public record: each registry record's project name, registry project type and
# methodology ("record text"), plus the registry's own project description where one is published (Gold Standard).
#
# Each tag has: label (shown), aliases (extra search terms) and up to three rules:
#   re   explicit terms that state the tag outright (e.g. "alternate wetting and drying"). In the record text they
#        apply to any project, whatever its credit type (so bundles and odd registry types are still tagged).
#   ctx  looser context terms (e.g. "farmer", "heat", "mill") that only mean the tag inside its credit types.
#   l2   the credit types (config/taxonomy.yaml) where the tag is expected. Inside them, `re` and `ctx` are also
#        read from registry descriptions; outside them descriptions are ignored (they mention things in passing).
#        A tag with only `l2` (the broad tags at the end) applies to every project of those types.
#   near credit types where description evidence (`re`/`ctx`) also counts, without the tag being automatic there
#        (e.g. a wastewater project whose description says it produces biogas -> Biogas).
#   max_mw  also apply when the record's stated capacity is at most this (small hydro).
# Broad tags have ids starting with t_ and are given to every project of their credit types.
# Typing a label or alias in the search box shows exactly the projects with that tag
# (also tags whose term starts with the query plus a space: "solar" -> "solar lantern", "solar water heater").
# Check changes with: uv run python -m pipeline.tag_audit   (lists misses and loosely-assigned tags)
tags:
  # --- Rice ---
  - {id: awd, label: AWD, aliases: [alternate wetting and drying, alternate wetting & drying], l2: [rice_methane, soil_carbon],
     re: '\bAWD\b|alternat\w* wet\w* (and|&|/) ?dry|wet(ting)? (and|&|/) ?dry(ing)? (rice|irrigation|method|technolog|practice|cultivation)'}
  - {id: dsr, label: DSR, aliases: [direct seeded rice, direct-seeded rice, dry seeded rice], l2: [rice_methane, soil_carbon],
     re: '\bDSR\b|direct[- ]?(seed(ed|ing)?|sown|sowing) (of )?rice|dry[- ]seed(ed|ing)? rice'}
  - {id: rice_water_mgmt, label: Rice water management, aliases: [ams-iii.au, mid-season drainage, adjusted water management], l2: [rice_methane],
     re: 'AMS-III\.AU|adjusted water management|mid-?(season|summer) drainage|midsummer drainage|intermittent (flooding|irrigation)',
     ctx: 'water management|drainage|Improved Irrigation Management|irrigation'}
