  - {id: electric_cooking, label: Electric cooking, aliases: [e-cooking, ecooking, induction cooking], re: 'electric (cook|pressure)|e-?cook|induction (cook|stove)'}
  - {id: lpg_cooking, label: LPG cooking, aliases: [lpg], l2: [cookstoves, fuel_switch], re: '\bLPG\b'}
