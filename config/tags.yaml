  - {id: water_filter, label: Water filters, aliases: [water purification, safe drinking water], l2: [water], re: 'filter|purif|safe (drinking )?water|Clean Water'}
  - {id: borehole, label: Boreholes, aliases: [community boreholes], re: 'borehole'}
  - {id: solar_lantern, label: Solar lanterns / home systems, aliases: [solar home system, shs, solar lantern, solar lighting], re: 'solar (home|lantern|lamp|light)|\bSHS\b'}
