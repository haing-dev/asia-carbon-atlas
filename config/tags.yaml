# Searchable project tags (shown in the "Tag" column). A project can carry several tags.
# Each tag: label (shown), aliases (extra search terms, matched case-insensitively), and how it is assigned:
#   re: regex (case-insensitive) tested against each registry record's registry type, methodology codes and name,
#       project name and the registry's own project description where published (Gold Standard) -- evidence
#       that is in the public record itself;
#   l2: credit types (config/taxonomy.yaml). With `re`, the tag applies only to projects of those types;
#       without `re`, every project of those types gets it (the broad tags at the end).
# Typing a label or alias in the search box shows exactly the projects with that tag
# (also tags whose term starts with the query plus a space: "solar" -> "solar lantern", "solar water heater").
tags:
  # --- Rice ---
  - {id: awd, label: AWD, aliases: [alternate wetting and drying, alternate wetting & drying, rice methane], l2: [rice_methane, soil_carbon],
     re: '\bAWD\b|alternat\w* wet|wet(ting)? (and|&|/) ?dry(ing)?'}
  - {id: dsr, label: DSR, aliases: [direct seeded rice, direct-seeded rice, dry seeded rice, rice methane], l2: [rice_methane, soil_carbon],
     re: '\bDSR\b|direct[- ]?seed(ed|ing)? rice|dry[- ]seed(ed|ing)? rice'}
  - {id: rice_water_mgmt, label: Rice water management, aliases: [ams-iii.au, mid-season drainage, rice methane], l2: [rice_methane],
     re: 'AMS-III\.AU|adjusted water management|water management practice|mid-?(season|summer) drainage|midsummer drainage|intermittent (flooding|irrigation)|water management|drainage|Improved Irrigation Management'}
  # --- Soil & agriculture ---
  - {id: regen_ag, label: Regenerative agriculture, aliases: [regen ag, regenerative farming, regenerative agriculture], l2: [soil_carbon, agroforestry, rice_methane, fertilizer], re: 'regenerative (agri|farm|practice)|regen ag'}
  - {id: grazing, label: Grazing management, aliases: [rangeland, grassland management, sustainable grazing], l2: [soil_carbon, other_land],
     re: 'grazing|grassland|rangeland|ranch|VM0026|VM0032'}
  - {id: cover_crops, label: Cover crops, aliases: [cover cropping], l2: [soil_carbon, rice_methane, fertilizer], re: 'cover[- ]crop'}
  - {id: no_till, label: No-till, aliases: [zero tillage, conservation tillage, reduced tillage], l2: [soil_carbon, rice_methane, fertilizer], re: 'no[- ]till|zero[- ]till|conservation tillage|reduced tillage'}
  - {id: sustainable_ag, label: Sustainable land management, aliases: [sustainable agriculture, climate-smart agriculture, carbon farming, salm], l2: [soil_carbon, rice_methane, agroforestry],
     re: 'sustainable (agricultur|cropland|land|cotton|farm|crop)|climate[- ]smart|carbon farming|VM0017|SALM|cropland management'}
  - {id: microbial, label: Soil microbes, aliases: [microbial carbon], l2: [soil_carbon, fertilizer], re: 'microb'}
  - {id: manure_digester, label: Manure digester, aliases: [manure methane, manure management], l2: [livestock, biogas_ad, household_biogas],
     re: 'manure|dairy|swine|pig farm|hog farm|poultry|animal waste|livestock'}
