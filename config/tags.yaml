  - {id: regen_ag, label: Regenerative agriculture, aliases: [regen ag, regenerative farming], l2: [soil_carbon, agroforestry, rice_methane, fertilizer],
     re: 'regenerative (agri|farm|practice|grazing)|regen ag'}
  - {id: grazing, label: Grazing management, aliases: [rangeland, grassland management, sustainable grazing], l2: [soil_carbon, other_land],
     re: 'grazing|rangeland|VM0026|VM0032|grassland management', ctx: 'grassland|ranch|pasture|cattle'}
