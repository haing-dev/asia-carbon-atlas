  - {id: solar_thermal, label: Solar thermal, aliases: [csp, concentrated solar], re: 'solar thermal|concentrat\w* solar|\bCSP\b'}
  - {id: solar_water_heater, label: Solar water heater, aliases: [solar water heating], re: 'solar water heat'}
  - {id: offshore_wind, label: Offshore wind, aliases: [], re: 'offshore wind|wind.*offshore'}
  - {id: run_of_river, label: Run-of-river hydro, aliases: [run of river, ror], re: 'run[- ]of[- ]river'}
  - {id: small_hydro, label: Small hydro, aliases: [mini hydro, micro hydro], re: '(small|mini|micro)[- ]?hydro'}
  - {id: dam_hydro, label: Reservoir hydro, aliases: [dam, reservoir], l2: [hydro], re: '\bdam\b|reservoir'}
  - {id: bagasse, label: Bagasse, aliases: [sugarcane bagasse, sugar mill cogeneration], re: 'bagasse|sugar (mill|factory)|sugars ltd'}
