  - {id: sustainable_ag, label: Sustainable land management, aliases: [sustainable agriculture, climate-smart agriculture, carbon farming, salm],
     l2: [soil_carbon, agroforestry],
     re: 'sustainable (agricultur|cropland|land management|cotton|farming)|climate[- ]smart (agri|farm|rice)|carbon farming|VM0017|\bSALM\b|cropland management|agricultural land management',
     ctx: 'sustainable|improved agricultural practices'}
  - {id: microbial, label: Soil microbes, aliases: [microbial carbon], l2: [soil_carbon, fertilizer], re: 'microbial (carbon|inoculant)', ctx: 'microb'}
  - {id: manure_digester, label: Manure digester, aliases: [manure methane, manure management, dairy digester], l2: [livestock, biogas_ad, household_biogas, composting, biomass_power],
     re: 'manure|dairy digester|swine|piggery|pig farm|hog farm|poultry litter|animal waste|cattle (dung|waste)|cow dung',
     ctx: 'dairy|poultry|livestock|dung|cattle|farm'}
  - {id: feed_additive, label: Feed additives, aliases: [enteric methane, 3-nop, bovaer, asparagopsis], l2: [livestock, soil_carbon], re: 'feed additive|enteric|3-NOP|bovaer|asparagopsis'}
