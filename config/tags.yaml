# Searchable project tags (shown in the "Tag" column). A project can carry several tags.
# Each tag: label (shown), aliases (extra search terms, matched case-insensitively), and how it is assigned:
#   re: regex (case-insensitive) tested against each registry record's "<registry type> | <methodology codes> |
#       <methodology name> | <project name>" -- evidence that is in the public record itself;
#   l2: credit types (config/taxonomy.yaml). With `re`, the tag applies only to projects of those types;
#       without `re`, every project of those types gets it (the broad tags at the end).
# Typing a label or alias in the search box shows exactly the projects with that tag
# (also tags whose term starts with the query plus a space: "solar" -> "solar lantern", "solar water heater").
tags:
  # --- Rice ---
  - {id: awd, label: AWD, aliases: [alternate wetting and drying, alternate wetting & drying, rice methane], l2: [rice_methane, soil_carbon],
     re: '\bAWD\b|alternat\w* wetting|wetting (and|&) drying'}
  - {id: dsr, label: DSR, aliases: [direct seeded rice, direct-seeded rice, dry seeded rice, rice methane], l2: [rice_methane, soil_carbon],
     re: '\bDSR\b|direct[- ]?seed(ed|ing)? rice|dry[- ]seed(ed|ing)? rice'}
  - {id: rice_water_mgmt, label: Rice water management, aliases: [ams-iii.au, mid-season drainage, rice methane], l2: [rice_methane],
     re: 'AMS-III\.AU|adjusted water management|water management practice|mid-?season drainage|intermittent (flooding|irrigation)|Improved Irrigation Management'}
  # --- Soil & agriculture ---
  - {id: regen_ag, label: Regenerative agriculture, aliases: [regen ag, regenerative farming, regenerative agriculture], re: 'regenerative (agri|farm|practice)|regen ag'}
  - {id: grazing, label: Grazing management, aliases: [rangeland, grassland management, sustainable grazing], l2: [soil_carbon, other_land],
     re: 'grazing|grassland|rangeland|ranch|VM0026|VM0032'}
  - {id: cover_crops, label: Cover crops, aliases: [cover cropping], re: 'cover[- ]crop'}
  - {id: no_till, label: No-till, aliases: [zero tillage, conservation tillage, reduced tillage], re: 'no[- ]till|zero[- ]till|conservation tillage|reduced tillage'}
  - {id: microbial, label: Soil microbes, aliases: [microbial carbon], re: 'microb'}
  - {id: manure_digester, label: Manure digester, aliases: [manure methane, manure management], l2: [livestock, biogas_ad, household_biogas],
     re: 'manure|dairy|swine|pig farm|hog farm|poultry|animal waste|livestock'}
  - {id: feed_additive, label: Feed additives, aliases: [enteric methane, 3-nop, bovaer, asparagopsis], re: 'feed additive|enteric|3-NOP|bovaer|asparagopsis'}
  - {id: nitrogen_mgmt, label: Nitrogen management, aliases: [fertilizer management, fertiliser management, n2o soil], l2: [fertilizer, soil_carbon],
     re: 'nitrogen|fertili[sz]er'}
  # --- Forestry & land use ---
  - {id: jurisdictional, label: Jurisdictional REDD+, aliases: [jredd, jurisdictional, jnr, art trees, trees], re: 'jurisdictional|\bJNR\b|^ART TREES|REDD\+ Results'}
  - {id: apd, label: Avoided planned deforestation, aliases: [apd, planned deforestation], l2: [redd], re: '(?<!un)planned deforestation|\bAPD\b'}
  - {id: aud, label: Avoided unplanned deforestation, aliases: [aud, unplanned deforestation], l2: [redd], re: 'unplanned deforestation|\bAUDD?\b|VM0015'}
  - {id: mangrove, label: Mangrove, aliases: [mangroves, mangrove restoration], re: 'mangrove'}
  - {id: seagrass, label: Seagrass, aliases: [sea grass], re: 'sea ?grass'}
  - {id: tidal_marsh, label: Tidal marsh, aliases: [salt marsh, saltmarsh, tidal wetland], re: 'salt ?marsh|tidal (wetland|marsh)'}
  - {id: peatland, label: Peatland, aliases: [peat, peat swamp, peatland rewetting], re: '\bpeat'}
  - {id: native_restoration, label: Native forest restoration, aliases: [native species, ecological restoration, forest restoration], l2: [arr, other_land, agroforestry],
     re: 'native (species|forest|tree)|restor'}
  - {id: plantation, label: Commercial plantation, aliases: [timber plantation, plantation forestry], l2: [arr], re: 'plantation|timber|eucalyptus|\bteak\b|\bpine\b|acacia|rubber'}
  - {id: bamboo, label: Bamboo, aliases: [], re: 'bamboo'}
  - {id: agroforestry_tag, label: Agroforestry, aliases: [agro-forestry, silvopasture, silvopastoral], re: 'agro-?forestry|silvopast'}
  - {id: urban_forest, label: Urban forestry, aliases: [urban trees], re: 'urban (fores|tree)'}
  - {id: ril, label: Reduced-impact logging, aliases: [ril, reduced impact logging], re: 'reduced[- ]impact logging|\bRIL\b'}
  - {id: logged_protected, label: Logged to protected forest, aliases: [ltpf], re: 'logged to protected|\bLtPF\b'}
  - {id: avoided_grassland, label: Avoided grassland conversion, aliases: [grassland conversion], re: 'Avoided Grassland Conversion'}
  # --- Engineered removal ---
  - {id: biochar_tag, label: Biochar, aliases: [bio-char, pyrolysis], re: 'bio-?char'}
  - {id: erw_tag, label: ERW, aliases: [enhanced rock weathering, enhanced weathering, rock weathering], re: 'rock weathering|\bERW\b|enhanced weathering'}
  - {id: dac_tag, label: DAC, aliases: [direct air capture, daccs], re: 'direct air capture|\bDAC(CS)?\b'}
  - {id: beccs_tag, label: BECCS, aliases: [bioenergy with carbon capture, bioenergy carbon capture and storage], re: 'BECCS|bioenergy with carbon capture|geologically stored'}
  - {id: bio_oil, label: Bio-oil, aliases: [bio oil, bio-oil sequestration], re: 'bio-?oil'}
  - {id: oae, label: Ocean alkalinity, aliases: [oae, ocean alkalinity enhancement], re: 'ocean alkalinity|\bOAE\b'}
  - {id: concrete, label: Carbonated concrete, aliases: [concrete, co2 mineralization in concrete], l2: [mineralization, cement], re: 'concrete'}
  - {id: biomass_burial, label: Biomass burial, aliases: [terrestrial storage of biomass, wood vault], re: 'biomass burial|terrestrial storage|wood vault'}
  - {id: wood_building, label: Wood construction, aliases: [mass timber, wooden building], re: 'wood(en)? (building|construction)|mass timber'}
  # --- Renewable energy ---
  - {id: rooftop_solar, label: Rooftop solar, aliases: [distributed solar, solar rooftop, rooftop pv], l2: [solar, offgrid_solar],
