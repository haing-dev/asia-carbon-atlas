# One entry per source adapter (pipeline/sources/<id>.py).
# enabled: false until the adapter is built and spot-checked.
# label: shown on the site. cadence_days: minimum days between probes (the 10-day schedule probes everything due).
sources:
  vrod:
    label: Berkeley Voluntary Registry Offsets Database (Verra, Gold Standard, Isometric, ACR, CAR, ART TREES)
    registries: [VCS, GS, ISO, ACR, CAR, ART]
    url: https://gspp.berkeley.edu/berkeley-carbon-trading-project/offsets-database
    license: CC BY 4.0
    enabled: true
    cadence_days: 7
  gsreg:
    label: Gold Standard registry API (project page links only)
    registries: []
    url: https://registry.goldstandard.org/projects
    enabled: true
    cadence_days: 7
  verradesc:
    label: Verra registry project descriptions (tags only)
    registries: []
    url: https://registry.verra.org/
    enabled: true
    cadence_days: 1   # backfills ~120 projects a day until done, then only new projects
  offsetsdb:
    label: CarbonPlan OffsetsDB (retirements by beneficiary — Verra, Gold Standard, ACR, CAR, ART TREES)
    registries: []
    url: https://carbonplan.org/research/offsetsdb
    enabled: true
    cadence_days: 7
  cdm:
    label: UNFCCC Clean Development Mechanism (via UNEP-CCC CDM Pipeline)
    registries: [CDM]
    url: https://unepccc.org/cdm-ji-pipeline/
    enabled: true
    cadence_days: 7
  gcc:
    label: Global Carbon Council (approved-projects export)
    registries: [GCC]
    url: https://gcc2.globalcarboncouncil.com/search/registration
    enabled: true   # site is behind a bot challenge: read from the owner's export in data/manual/gcc/
    cadence_days: 7
  ucr:
    label: Universal Carbon Registry
    registries: [UCR]
    url: https://www.ucarbonregistry.io/
    enabled: true
    cadence_days: 7
  puro:
    label: Puro.earth Registry
    registries: [PURO]
    url: https://registry.puro.earth/
    enabled: true
    cadence_days: 7
  isometric:
    label: Isometric Registry (API; needs ISOMETRIC_API_KEY)
    registries: [ISO]
    url: https://registry.isometric.com/
    enabled: false
    cadence_days: 7
  jcm:
    label: Joint Crediting Mechanism (Japan) — registered projects
    registries: [JCM]
    url: https://www.jcm.go.jp/
    enabled: true
    cadence_days: 7
  a6pipeline:
    label: UNEP-CCC Article 6 Pipeline
    registries: [PACM, A62]
    url: https://a6pipeline.unepccc.org/
    license: UNEP-CCC (attribution)
    enabled: true
    cadence_days: 7
