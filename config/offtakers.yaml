# Publicly announced offtakes / purchases (SPEC §10.4). Hand-curated; every item needs buyer, project or supplier,
# date and a source that states all three. No inference. Volumes are the announced totals (often multi-year).
#
# offtakes:        deals that name (or unambiguously identify) one registry project -> shown on that project's row.
# announced_rows:  deals at supplier level, or for projects not (yet) in a covered registry -> one row per supplier
#                  and credit type, stage "Announced", linked to the announcement (no volumes added to the map).
# Researched 2026-10-12 (web); each source was opened and the quoted sentence checked.

# Buyer name variants -> one name for the "All Regions" offtaker charts (the table keeps the announced wording).
buyer_aliases:
  Frontier buyers: Frontier
  TD Securities: TD Bank Group
  TD Bank: TD Bank Group
  KliK Foundation (with Climate Cent Foundation): KliK Foundation
  Emergent (LEAF Coalition): LEAF Coalition
  JPMorganChase: JPMorgan Chase

# Joint buyers named in one announcement with one volume and no published split: the All Regions charts credit each
# member an equal share (owner rule, 2026-10-16). The project table keeps the announced wording.
buyer_splits:
  Google and McKinsey (Symbiosis Coalition): [Google, McKinsey]
  Symbiosis Coalition (Meta, Google, McKinsey): [Meta, Google, McKinsey]
  Adyen and Nasdaq: [Adyen, Nasdaq]

