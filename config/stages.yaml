# Raw registry status -> stage (docs/SPEC.md §5). Keys: registry code -> lowercase raw status -> stage.
# Rules applied in pipeline/process.py:
#   - mapped "inactive" always wins;
#   - otherwise issued > 0 => "issuing";
#   - "registered" with crediting period ended and nothing issued => "inactive".
# An unmapped status fails validation: add it here.
stages: [pipeline, registered, issuing, inactive]
map:
  CDM:
    registered: registered
    rejected: inactive
    withdrawn: inactive
    deregistered: inactive
    pending publication: inactive    # CDM closed to new registrations; stale requests
    provisional: inactive
  PURO:
    issuing: issuing
    registered: registered
  VCS:
    registered: registered
    late to verify: registered
    verification approval requested: registered
    units transferred from approved ghg program: registered
    crediting period renewal requested: registered
    crediting period renewal and verification approval requested: registered
    requantification requested: registered
    verification approval request denied: registered
    on hold - see notification letter: registered
    pipeline listing (under development) approved: pipeline
    pipeline listing requested (under development): pipeline
    pipeline listing requested (under validation): pipeline
    under validation (public comment period closed): pipeline
    under validation (public comment period open): pipeline
    registration requested: pipeline
    registration and verification approval requested: pipeline
    withdrawn: inactive
    inactive: inactive
    rejected by administrator: inactive
    registration request denied: inactive
    registration and verification approval request denied: inactive
  GS:
    gold standard certified project: registered
    gold standard certified design: registered
    listed: pipeline
  ISO:
    validated: registered
    under validation: pipeline
    validation unsuccessful: inactive
    cancelled: inactive
