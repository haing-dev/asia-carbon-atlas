# Buyer entities (one canonical name per company / government), used by the All Regions buyer table and buyer pages.
# aliases:             other spellings in config/offtakers.yaml or in registry retirement records (OffsetsDB
#                      harmonized beneficiary) -> this name.
# retirement_patterns: regexes matched against a retirement's beneficiary / account / note text when the record has
#                      no harmonized beneficiary (pipeline/sources/offsetsdb.py). Keep them specific: a pattern that
#                      could match an unrelated party (e.g. "Delta", "Amazon" rainforest) must not be used.
# lei:                 GLEIF Legal Entity Identifier of the parent, where public (https://search.gleif.org).
buyers:
  - name: Microsoft
    retirement_patterns: ['(?i)\bmicrosoft\b']
  - name: Google
    aliases: [Alphabet, Google LLC]
    retirement_patterns: ['(?i)\bgoogle\b', '(?i)\balphabet inc']
  - name: Meta
    aliases: [Meta Platforms, Facebook]
    retirement_patterns: ['\bMeta Platforms\b', '(?i)\bfacebook\b']
  - name: Amazon
    retirement_patterns: ['\bAmazon(\.com| Web Services| Inc| EU| Services)\b']
  - name: Apple
    retirement_patterns: ['\bApple Inc\b', '\bApple Operations\b']
  - name: Salesforce
    retirement_patterns: ['(?i)\bsalesforce\b']
  - name: Shell
    aliases: [Shell plc, Shell International, Royal Dutch Shell, Shell Environmental Products, Shell Energy North America]
    retirement_patterns: ['\bShell (plc|International|Energy|Trading|Eastern|Nederland|Deutschland|Brasil|Canada)\b', '\bRoyal Dutch Shell\b']
  - name: TotalEnergies
    aliases: [Total, TotalEnergies (ProxiFuel subsidiary), TotalEnergies Nature Based Solutions]
    retirement_patterns: ['(?i)\btotalenergies\b']
  - name: BP
    retirement_patterns: ['\bBP (p\.?l\.?c|Gas Marketing|Oil|Products|Europa)\b']
  - name: Eni
    aliases: [Eni Plenitude, Plenitude]
    retirement_patterns: ['\bEni S\.?p\.?A\b', '\bEni (plenitude|Live|Trading)\b']
  - name: Delta Air Lines
    aliases: [Delta, Delta Airlines]
    retirement_patterns: ['(?i)\bdelta air ?lines\b']
  - name: United Airlines
    retirement_patterns: ['(?i)\bunited airlines\b']
  - name: JetBlue
    retirement_patterns: ['(?i)\bjetblue\b']
  - name: easyJet
    retirement_patterns: ['(?i)\beasyjet\b']
  - name: Lufthansa Group
    aliases: [Lufthansa]
    retirement_patterns: ['(?i)\blufthansa\b']
  - name: British Airways (IAG)
    aliases: [British Airways, IAG]
  - name: Air France-KLM
    retirement_patterns: ['(?i)\bair france\b', '\bKLM\b']
  - name: Qantas
    retirement_patterns: ['(?i)\bqantas\b']
  - name: Singapore Airlines
    retirement_patterns: ['(?i)\bsingapore airlines\b']
  - name: All Nippon Airways (ANA)
    aliases: [ANA, All Nippon Airways]
    retirement_patterns: ['(?i)\ball nippon airways\b']
  - name: Japan Airlines
    aliases: [ZIPAIR Tokyo (JAL group), Japan Airlines (JAL), JAL]
    retirement_patterns: ['(?i)\bjapan airlines\b']
  - name: Kering
    aliases: [Gucci, Gucci (Kering), PPR (now Kering), Saint Laurent, Bottega Veneta, Balenciaga]
  - name: The Walt Disney Company
    aliases: [Disney, Walt Disney]
    retirement_patterns: ['(?i)\bwalt disney\b']
  - name: Netflix
    retirement_patterns: ['(?i)\bnetflix\b']
  - name: Nestlé
    aliases: [Nestle, Nespresso]
    retirement_patterns: ['(?i)\bnestl[eé]\b']
  - name: Volkswagen Group
    aliases: [Volkswagen, Audi, Skoda, ŠKODA, SEAT, Cupra, Volkswagen AG]
    retirement_patterns: ['(?i)\bvolkswagen\b']
  - name: Mercedes-Benz
    retirement_patterns: ['(?i)\bmercedes[- ]benz\b', '(?i)\bdaimler\b']
  - name: BMW
    aliases: [BMW Group]
    retirement_patterns: ['\bBMW\b']
  - name: Boeing
    retirement_patterns: ['(?i)\bboeing\b']
  - name: Airbus
    retirement_patterns: ['(?i)\bairbus\b']
  - name: JPMorgan Chase
    aliases: [JPMorganChase, JP Morgan, J.P. Morgan]
    retirement_patterns: ['(?i)\bj\.? ?p\.? ?morgan\b', '(?i)\bjpmorgan']
  - name: Bank of America
    retirement_patterns: ['(?i)\bbank of america\b']
  - name: Morgan Stanley
    retirement_patterns: ['(?i)\bmorgan stanley\b']
  - name: Goldman Sachs
    retirement_patterns: ['(?i)\bgoldman sachs\b']
  - name: Swiss Re
    retirement_patterns: ['(?i)\bswiss re\b']
  - name: UBS
    retirement_patterns: ['\bUBS\b']
  - name: Mastercard
    retirement_patterns: ['(?i)\bmastercard\b']
  - name: Visa
    retirement_patterns: ['\bVisa Inc\b']
  - name: Sumitomo Corporation
    retirement_patterns: ['(?i)\bsumitomo corporation\b']
  - name: Mitsubishi Corporation
    retirement_patterns: ['(?i)\bmitsubishi corporation\b']
  - name: Mitsui & Co.
