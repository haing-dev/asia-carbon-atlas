    retirement_patterns: ['(?i)\bitochu\b']
  - name: Marubeni
    aliases: [Marubeni Corporation]
    retirement_patterns: ['(?i)\bmarubeni\b']
  - name: NYK Line
    aliases: [NYK Line (NYK Group), NYK]
  - name: Mitsui O.S.K. Lines (MOL)
    aliases: [MOL, Mitsui O.S.K. Lines]
  - name: INPEX
    retirement_patterns: ['\bINPEX\b']
  - name: Trafigura
    retirement_patterns: ['(?i)\btrafigura\b']
  - name: GSK
    retirement_patterns: ['\bGSK\b', '(?i)\bglaxosmithkline\b']
  - name: Shopify
    retirement_patterns: ['(?i)\bshopify\b']
  - name: Stripe
    retirement_patterns: ['\bStripe, Inc\b']
  - name: Frontier
    aliases: [Frontier buyers, Frontier Climate]
  - name: Milkywire
    aliases: [Milkywire (Salesforce-backed), Milkywire (Climate Transformation Fund)]
  - name: Boston Consulting Group
    aliases: [BCG, Boston Consulting Group (via ClimeFi)]
  - name: Klimate
    aliases: [Klimate.co]
    retirement_patterns: ['(?i)\bfrontier climate\b']
  - name: TD Bank Group
    aliases: [TD Securities, TD Bank]
    retirement_patterns: ['(?i)\btd (bank|securities)\b', '(?i)\btoronto-dominion\b']
  - name: KliK Foundation
    aliases: [KliK Foundation (with Climate Cent Foundation), Stiftung KliK]
    retirement_patterns: ['(?i)\bklik\b']
  - name: Government of Norway
    aliases: [Government of Norway (NACA Fund via GGGI), Norway]
  - name: LEAF Coalition
    aliases: [Emergent (LEAF Coalition)]
  - name: AT&T
    retirement_patterns: ['\bAT&T\b']
  - name: Uber
    retirement_patterns: ['\bUber (Technologies|B\.V)\b']
  - name: Cosmo Energy Holdings
    aliases: [Cosmo Oil Marketing]
  - name: ENTEGA
    aliases: [ENTEGA Plus]
  - name: Ørsted
    aliases: [Orsted]
    retirement_patterns: ['(?i)\b[øo]rsted\b']

# Retirement beneficiaries that are not end buyers (intermediary client pools, token bridges, registry corrections):
# left out of the buyer table. Their retirements still count in project and region totals.
exclude_beneficiaries:
  - '(?i)\bclients?\b'
  - '(?i)\btoucan'
  - '(?i)\bklima ?dao\b'
  - '(?i)over-issuance'
  - '(?i)\bbuffer\b'
