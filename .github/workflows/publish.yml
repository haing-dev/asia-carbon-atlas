# Website, config, rule or review changes: rebuild from committed records and deploy. Never fetches sources.
name: publish
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config/**"
      - "review/**"
      - "data/**"
      - "content/**"
      - "pipeline/**"
      - "!pipeline/sources/**"
      - "!pipeline/discover.py"
      - "!pipeline/population.py"
      - "!pipeline/review_page.py"
      - "!pipeline/templates/**"
      - "!review/dedupe_pending.csv"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
