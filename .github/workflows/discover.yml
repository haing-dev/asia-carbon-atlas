# Manual helper while building adapters: fetch URLs politely and publish summaries to the `ci-logs` branch.
name: discover
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: false
        default: ""
      browse:
        description: "Space-separated URLs to open in a headless browser (logs the page's API requests)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - if: inputs.urls != ''
        env:
          URLS: ${{ inputs.urls }}
        run: uv run python -m pipeline.discover $URLS
      - if: inputs.browse != ''
        env:
          URLS: ${{ inputs.browse }}
          BROWSE_GAP_MS: "120000"
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules cp scripts/browse.mjs /tmp/pw/ && node /tmp/pw/browse.mjs $URLS
      - name: Publish to ci-logs branch
        run: |
          mkdir -p /tmp/out && cp -r work/discover /tmp/out/
          cd /tmp/out
          git init -q -b ci-logs && git config user.name atlas-bot && git config user.email atlas-bot@users.noreply.github.com
          git add -A && git commit -qm "discover run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
