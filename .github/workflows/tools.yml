# Rare maintenance jobs that need the network and write committed config (e.g. population reference data).
name: tools
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which job to run"
        type: choice
        options: [population]
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run
        run: uv run python -m pipeline.${{ inputs.task }} 2>&1 | tee /tmp/tools.log
      - run: echo "::notice::$(tail -1 /tmp/tools.log)"
      - name: Commit if changed
        run: |
          git config user.name atlas-bot && git config user.email atlas-bot@users.noreply.github.com
          git add config/
          git diff --cached --quiet && exit 0
          git commit -qm "tools: ${{ inputs.task }}"
          git pull -q --rebase origin main && git push -q origin HEAD:main
